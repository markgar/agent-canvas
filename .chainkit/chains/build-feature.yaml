name: agent-canvas-feature

seeds:
  spec: 'NO SPEC SELECTED: use npm run chainkit:run with an approved feature.'
  productRules: '@../governance/product.md'
  planningRules: '@../governance/planning.md'
  codingRules: '@../governance/coding.md'
  reviewingRules: '@../governance/reviewing.md'

defaults:
  model: gpt-5.6-sol-fast
  effort: high
  timeoutMs: 900000

requires:
  run: node --import tsx .chainkit/scripts/stage.ts preflight

stages:
  - id: plan
    prompt: ../prompts/plan.md
    tools: true
    produces: plan
    parse: json
    expects: { chunks: array }
    completion:
      run: node --import tsx .chainkit/scripts/stage.ts check-plan
      attempts: 2

  - id: plan-review
    prompt: ../prompts/plan-review.md
    model: gpt-5.6-sol-fast
    tools: true
    produces: planReview
    parse: json
    expects: { pass: boolean, findings: array }

  - id: plan-fix
    prompt: ../prompts/plan-fix.md
    tools: true
    resumeFrom: plan
    produces: buildPlan
    parse: json
    expects: { chunks: array }
    completion:
      run: node --import tsx .chainkit/scripts/stage.ts check-build-plan
      attempts: 2

  - id: lock-plan
    run: node --import tsx .chainkit/scripts/stage.ts lock-plan

  - id: prepare
    run: node --import tsx .chainkit/scripts/stage.ts prepare
    produces: chunkSpec

  - id: code
    prompt: ../prompts/code.md
    tools: true
    produces: buildNotes

  - id: measure
    run: node --import tsx .chainkit/scripts/stage.ts measure
    produces: facts
    parse: json
    expects:
      { pass: boolean, fingerprint: string, outOfScope: array, checks: array }

  - id: review
    prompt: ../prompts/review.md
    model: gpt-5.6-sol-fast
    tools: true
    produces: review
    parse: json
    expects: { pass: boolean, findings: array }

  - id: fix
    prompt: ../prompts/fix.md
    tools: true
    resumeFrom: code

  - id: remeasure
    run: node --import tsx .chainkit/scripts/stage.ts measure
    produces: facts
    parse: json
    expects:
      { pass: boolean, fingerprint: string, outOfScope: array, checks: array }

foreach:
  over: buildPlan.chunks
  as: chunk
  max: 8
  expects:
    id: string
    title: string
    files: array
    specRefs: array
    requirementIds: array
    checkIds: array
    blueprint: string
  stages:
    - prepare
    - code
    - measure
    - review
    - fix
    - remeasure
  completion:
    run: node --import tsx .chainkit/scripts/stage.ts chunk-gate
    attempts: 1

completion:
  run: node --import tsx .chainkit/scripts/stage.ts final-gate
  attempts: 1
