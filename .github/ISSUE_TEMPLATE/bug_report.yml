name: Bug report
description: Report a reproducible Agent Canvas problem.
body:
  - type: markdown
    attributes:
      value: Do not include real email, draft text, credentials, or access URLs. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example using synthetic content.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser, and MCP host if applicable.
    validations:
      required: true
